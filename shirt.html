
<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5" />
    <title>MRST CROCKERY · প্রিমিয়াম ক্রকারি</title>
    <!-- Google Fonts + Font Awesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }
        body {
            background: #faf8f6;
            color: #1e1e2a;
            transition: background 0.3s, color 0.3s;
            padding-bottom: 80px;
        }
        body.dark {
            background: #14141e;
            color: #eaeaea;
        }
        a {
            text-decoration: none;
            color: inherit;
        }
        ul {
            list-style: none;
        }

        /* glassmorphism */
        .glass {
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 28px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.03);
        }
        .dark .glass {
            background: rgba(30, 30, 46, 0.7);
            border-color: rgba(255, 215, 0, 0.15);
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Header */
        .header {
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 12px 0;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.02);
            transition: all 0.3s;
        }
        .dark .header {
            background: rgba(20, 20, 30, 0.85);
        }
        .header .container {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px 16px;
        }
        .logo {
            font-size: 1.9rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #b8860b, #ffb347);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-right: 6px;
        }
        .logo i {
            background: none;
            -webkit-text-fill-color: #b8860b;
            margin-right: 4px;
        }
        .search-wrap {
            flex: 1 1 240px;
            display: flex;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 60px;
            padding: 2px 4px 2px 18px;
            border: 1px solid rgba(0, 0, 0, 0.04);
            backdrop-filter: blur(4px);
        }
        .dark .search-wrap {
            background: rgba(50, 50, 70, 0.4);
            border-color: rgba(255, 215, 0, 0.1);
        }
        .search-wrap input {
            flex: 1;
            border: none;
            background: transparent;
            padding: 10px 0;
            font-size: 0.9rem;
            outline: none;
            min-width: 80px;
        }
        .search-wrap button {
            background: #b8860b;
            border: none;
            border-radius: 40px;
            padding: 8px 20px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }
        .search-wrap button:hover {
            background: #a06e0a;
            transform: scale(0.95);
        }

        .nav-icons {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .nav-icons a,
        .nav-icons .icon-btn {
            background: rgba(255, 255, 240, 0.3);
            border-radius: 40px;
            padding: 8px 12px;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid transparent;
            transition: 0.3s;
            color: #1e1e2a;
            font-weight: 500;
            cursor: pointer;
        }
        .dark .nav-icons a,
        .dark .nav-icons .icon-btn {
            color: #eaeaea;
            background: rgba(255, 255, 255, 0.04);
        }
        .nav-icons a:hover,
        .nav-icons .icon-btn:hover {
            border-color: #b8860b;
            background: rgba(184, 134, 11, 0.08);
            transform: translateY(-2px);
        }
        .cart-badge {
            background: #b8860b;
            color: white;
            border-radius: 30px;
            padding: 0 10px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        /* Hero */
        .hero-slider {
            margin: 24px 0;
            border-radius: 40px;
            overflow: hidden;
            background: linear-gradient(145deg, #f3efe8, #fffcf7);
            padding: 30px 30px 30px 40px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.02);
            animation: slideUp 0.8s ease;
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .dark .hero-slider {
            background: #1f1f30;
        }
        .hero-text h2 {
            font-size: 2.4rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1.1;
        }
        .hero-text .gold {
            color: #b8860b;
        }
        .hero-text p {
            margin: 12px 0 18px;
            opacity: 0.7;
        }
        .btn-primary {
            background: #b8860b;
            border: none;
            padding: 12px 34px;
            border-radius: 60px;
            font-weight: 700;
            color: white;
            font-size: 1rem;
            box-shadow: 0 4px 12px rgba(184, 134, 11, 0.3);
            transition: 0.3s;
            display: inline-block;
            cursor: pointer;
        }
        .btn-primary:hover {
            background: #9e740a;
            transform: scale(0.97);
        }
        .hero-badge {
            background: #ffedd5;
            border-radius: 60px;
            padding: 6px 20px;
            display: inline-block;
            font-weight: 600;
            color: #7a5d0b;
        }

        /* Categories */
        .cat-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 28px 0;
            justify-content: center;
        }
        .cat-item {
            background: white;
            padding: 8px 20px;
            border-radius: 60px;
            font-weight: 500;
            font-size: 0.85rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
            transition: 0.3s;
            border: 1px solid rgba(0, 0, 0, 0.02);
            cursor: pointer;
        }
        .dark .cat-item {
            background: #252537;
            color: #ddd;
        }
        .cat-item:hover {
            border-color: #b8860b;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(184, 134, 11, 0.1);
        }

        /* Products */
        .section-title {
            font-size: 1.7rem;
            font-weight: 700;
            margin: 30px 0 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .section-title i {
            color: #b8860b;
        }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 24px 16px;
        }
        .product-card {
            background: white;
            border-radius: 28px;
            padding: 16px 14px 18px;
            transition: 0.3s ease;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.01);
            border: 1px solid rgba(0, 0, 0, 0.02);
            position: relative;
            cursor: pointer;
        }
        .dark .product-card {
            background: #202032;
            border-color: #2e2e44;
        }
        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.08);
            border-color: rgba(184, 134, 11, 0.3);
        }
        .product-img {
            width: 100%;
            aspect-ratio: 1/1;
            background: #f2ede8;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.6rem;
            color: #b8860b;
            margin-bottom: 12px;
            transition: 0.3s;
        }
        .product-card:hover .product-img {
            transform: scale(1.05);
        }
        .product-name {
            font-weight: 600;
            font-size: 0.95rem;
            margin: 4px 0 2px;
        }
        .product-price {
            display: flex;
            gap: 8px;
            align-items: baseline;
            flex-wrap: wrap;
        }
        .price-old {
            text-decoration: line-through;
            opacity: 0.5;
            font-size: 0.8rem;
        }
        .price-new {
            font-weight: 700;
            color: #b8860b;
            font-size: 1.1rem;
        }
        .rating {
            color: #f5b342;
            font-size: 0.8rem;
        }
        .badge-discount {
            background: #b8860b;
            color: white;
            padding: 2px 12px;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 700;
            position: absolute;
            top: 12px;
            right: 12px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }
        .product-actions {
            display: flex;
            gap: 4px;
            margin-top: 12px;
        }
        .product-actions button {
            background: transparent;
            border: 1px solid #ddd;
            border-radius: 40px;
            padding: 6px 12px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            flex: 1;
        }
        .product-actions .add-cart {
            background: #b8860b;
            border: none;
            color: white;
        }
        .product-actions .add-cart:hover {
            background: #9e740a;
            transform: scale(0.95);
        }
        .product-actions .wishlist-btn:hover {
            color: #b8860b;
            border-color: #b8860b;
        }

        /* Flash Sale */
        .flash-countdown {
            display: flex;
            gap: 12px;
            align-items: center;
            font-weight: 700;
        }
        .countdown-item {
            background: #1e1e2a;
            color: white;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 1.2rem;
            animation: glow 1.5s infinite alternate;
        }
        @keyframes glow {
            from {
                box-shadow: 0 0 5px rgba(184, 134, 11, 0.3);
            }
            to {
                box-shadow: 0 0 20px rgba(184, 134, 11, 0.6);
            }
        }
        .dark .countdown-item {
            background: #b8860b;
            color: #14141e;
        }

        /* Modal / Popup */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease;
        }
        .modal.active {
            display: flex;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        .modal-content {
            background: white;
            border-radius: 40px;
            max-width: 700px;
            width: 90%;
            max-height: 85vh;
            overflow-y: auto;
            padding: 30px;
            position: relative;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.2);
        }
        .dark .modal-content {
            background: #1e1e30;
            color: #eaeaea;
        }
        .modal-close {
            position: sticky;
            top: 0;
            float: right;
            background: #b8860b;
            color: white;
            border: none;
            border-radius: 60px;
            width: 40px;
            height: 40px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.3s;
            z-index: 10;
        }
        .modal-close:hover {
            transform: rotate(90deg);
        }
        .modal-product-img {
            font-size: 5rem;
            text-align: center;
            margin: 10px 0;
        }
        .modal-product-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin: 10px 0;
        }
        .modal-product-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 15px 0;
        }
        .modal-product-details div {
            background: rgba(0, 0, 0, 0.03);
            padding: 8px 12px;
            border-radius: 12px;
        }
        .dark .modal-product-details div {
            background: rgba(255, 255, 255, 0.05);
        }
        .modal-specs {
            margin: 15px 0;
            line-height: 1.8;
        }
        .modal-specs strong {
            color: #b8860b;
        }
        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .modal-actions button {
            flex: 1;
            min-width: 120px;
            padding: 12px 24px;
            border: none;
            border-radius: 60px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }
        .modal-actions .btn-buy {
            background: #b8860b;
            color: white;
        }
        .modal-actions .btn-cart {
            background: #1e1e2a;
            color: white;
        }
        .dark .modal-actions .btn-cart {
            background: #b8860b;
        }
        .modal-actions button:hover {
            transform: scale(0.95);
        }

        /* Cart Popup */
        .cart-popup {
            display: none;
            position: fixed;
            top: 80px;
            right: 20px;
            background: white;
            border-radius: 28px;
            padding: 20px;
            min-width: 280px;
            max-width: 350px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            z-index: 999;
            border: 1px solid rgba(0, 0, 0, 0.05);
        }
        .dark .cart-popup {
            background: #1e1e30;
            border-color: #2e2e44;
        }
        .cart-popup.active {
            display: block;
            animation: slideDown 0.3s ease;
        }
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .cart-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }
        .cart-total {
            font-weight: 700;
            font-size: 1.1rem;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 2px solid #b8860b;
        }

        /* Form */
        .form-container {
            margin: 30px 0;
            padding: 30px;
            border-radius: 28px;
            background: white;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02);
        }
        .dark .form-container {
            background: #1a1a2c;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            border-radius: 16px;
            border: 1px solid #ddd;
            background: rgba(255, 255, 255, 0.5);
            transition: 0.3s;
        }
        .dark .form-group input,
        .dark .form-group select,
        .dark .form-group textarea {
            background: #252537;
            border-color: #3a3a50;
            color: white;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #b8860b;
            outline: none;
            box-shadow: 0 0 0 3px rgba(184, 134, 11, 0.1);
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        /* Footer */
        .footer {
            margin-top: 60px;
            padding: 40px 0 20px;
            border-top: 1px solid rgba(0, 0, 0, 0.03);
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(4px);
        }
        .dark .footer {
            background: #1a1a2c;
            border-color: #2b2b40;
        }
        .footer-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 30px;
        }
        .footer h4 {
            margin-bottom: 12px;
            font-weight: 700;
        }
        .footer a {
            opacity: 0.7;
            display: block;
            margin: 6px 0;
            transition: 0.3s;
        }
        .footer a:hover {
            opacity: 1;
            color: #b8860b;
            transform: translateX(5px);
        }

        /* Mobile Bottom Cart */
        .mobile-bottom-cart {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            padding: 12px 20px;
            border-top: 1px solid rgba(0, 0, 0, 0.04);
            justify-content: space-between;
            z-index: 99;
        }
        .dark .mobile-bottom-cart {
            background: #1e1e30;
            border-color: #333;
        }
        @media (max-width: 680px) {
            .mobile-bottom-cart {
                display: flex;
            }
            .header .container {
                gap: 8px;
            }
            .logo {
                font-size: 1.4rem;
            }
            .search-wrap {
                flex: 1 1 120px;
            }
            .nav-icons a span {
                display: none;
            }
            .hero-slider {
                padding: 20px;
                flex-direction: column;
                text-align: center;
            }
